{% extends "exams/base.html" %}
{% block main_class %}course-page{% endblock %}
{% block extra_head %}<style>
main.course-page{max-width:1080px;background:transparent;box-shadow:none;padding:12px 24px}
.course-page a{color:#124ab3}.course-page h1{margin:10px 0}.course-page h2{line-height:1.25}
.course-kicker{font-size:.82rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#31605a}
.course-lead{max-width:720px;color:#566275;margin:8px 0 26px}
.course-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:24px 0 32px}
.course-card{display:block;min-width:0;padding:24px;background:#fff;border:1px solid #dce2ea;border-radius:16px;text-decoration:none;color:#172033!important;box-shadow:0 5px 20px #1720330d;transition:transform .15s,border-color .15s,box-shadow .15s}
.course-card:hover{transform:translateY(-3px);border-color:#70a698;box-shadow:0 10px 26px #17203318}
.course-card:focus-visible,.lesson-tab:focus-visible{outline:3px solid #86aaff;outline-offset:3px}
.course-card h2{margin:14px 0 8px;font-size:1.35rem}.course-card p{color:#566275;margin:0 0 18px}
.course-meta{display:flex;gap:8px;flex-wrap:wrap}.course-chip{display:inline-block;background:#edf3f7;color:#344255;padding:5px 10px;border-radius:99px;font-size:.82rem;font-weight:700}
.course-stats{display:flex;justify-content:space-between;gap:12px;color:#526174;font-size:.88rem;margin:16px 0 8px}
.course-card progress,.course-progress progress{width:100%;height:9px;accent-color:#16815f}
.course-card strong,.course-progress strong{color:#176b52}.course-arrow{color:#124ab3;font-weight:700;margin-top:14px}
.course-breadcrumb{display:flex;flex-wrap:wrap;gap:8px;color:#647084;font-size:.9rem;margin-bottom:20px}
.course-breadcrumb a{text-decoration:none}.course-breadcrumb a:hover{text-decoration:underline}
.course-header,.section-header,.lesson-panel,.course-progress{background:#fff;border:1px solid #dce2ea;border-radius:16px;padding:24px}
.course-header p,.section-header p{color:#566275;margin-bottom:0}
.course-progress{margin:18px 0 8px;padding:16px 20px}
.section-grid{margin-top:18px}.section-number{display:inline-grid;place-items:center;width:36px;height:36px;background:#e4f2ed;border-radius:10px;color:#176b52;font-weight:800}
.lesson-menu{display:grid;grid-template-columns:repeat(auto-fill,44px);gap:8px;margin:18px 0 10px;padding:4px 2px;border:0}
.lesson-tab{position:relative;display:grid;place-items:center;width:44px;height:44px;background:#fff;border:1px solid #cbd4df;border-radius:8px;color:#344255!important;text-decoration:none;font-weight:700}
.lesson-tab:hover{border-color:#176b52}.lesson-tab.is-opened{background:#e7f5ee;border-color:#8bc7a7;color:#176b52!important}.lesson-tab.is-completed{background:#cdebd9;border-color:#429966;color:#14583d!important}.lesson-tab.is-completed::after{content:"✓";position:absolute;top:2px;right:4px;font-size:.65rem}.lesson-tab.is-current{box-shadow:0 0 0 2px #176b52}
.lesson-legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 18px;color:#566275;font-size:.82rem}.lesson-legend span{display:inline-flex;align-items:center;gap:5px}.lesson-legend i{width:12px;height:12px;border:1px solid #cbd4df;border-radius:3px;background:#fff}.lesson-legend .is-opened{background:#e7f5ee;border-color:#8bc7a7}.lesson-legend .is-completed{background:#cdebd9;border-color:#429966}
.lesson-panel{min-height:220px}.lesson-panel h2{margin-top:0}.lesson-panel .lesson-content{max-width:760px}.lesson-panel .lesson-content p{margin:0 0 1em}
.lesson-practice{border-top:1px solid #e1e8ed;margin-top:28px;padding-top:18px;color:#566275}
.lesson-practice h3{margin:0 0 16px;color:#172033}.practice-question{border:1px solid #dce2ea;border-radius:12px;padding:20px;margin:14px 0;scroll-margin-top:20px;background:#fff}.practice-question:target{border-color:#176b52}.practice-heading{display:flex;justify-content:space-between;gap:12px;color:#344255}.practice-heading span{font-size:.85rem}.practice-prompt{color:#172033;margin:14px 0}.practice-prompt p{margin:0 0 10px}.practice-option{display:block;margin:8px 0;padding:9px 12px;border:1px solid #dce2ea;border-radius:8px;cursor:pointer;color:#172033}.practice-option:hover{background:#f5f8fb}.practice-option input{margin-right:8px}.practice-answer-form textarea{min-height:110px}.practice-answer-form button{margin-top:12px}.practice-result{padding:12px 14px;margin:14px 0;border-radius:8px;background:#f0f3f7;color:#344255}.practice-result p{margin:8px 0 0}.practice-result.is-correct{background:#e7f5ee;color:#14583d}.practice-result.is-incorrect{background:#fff3e8;color:#774216}.practice-explain-button{margin-top:12px;background:#fff;color:#124ab3;border:1px solid #a9bfe4;padding:7px 12px}.practice-explanation{margin-top:12px;padding:12px;border-radius:8px;background:#fff;color:#172033}.practice-explanation p{margin:8px 0 0}.course-message{padding:10px 14px;background:#fff3e8;border:1px solid #ead2b3;border-radius:8px}
.practice-marking{margin:14px 0;padding:12px 14px;border:1px solid #dce2ea;border-radius:8px;color:#344255;background:#f8fafb}.practice-marking ul{list-style:none;margin:8px 0 0;padding:0}.practice-marking li{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid #e4e9ee}.practice-marking li strong{white-space:nowrap;color:#176b52}
.course-empty{background:#fff;border:1px dashed #b5c3d0;border-radius:16px;padding:30px;margin:24px 0;color:#566275}
@media(max-width:700px){main.course-page{margin:0;padding:18px}.course-grid{grid-template-columns:1fr}.course-card,.course-header,.section-header,.lesson-panel{padding:20px}.course-stats{flex-wrap:wrap}}
</style>{% endblock %}

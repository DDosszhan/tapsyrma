{% extends "exams/base.html" %}{% block content %}
<h1>Sign in to Tapsyrma</h1>
<p class="muted">Enter your school email and password.</p>
{% if form.errors %}<p class="error" role="alert">Invalid email or password.</p>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}
<input type="hidden" name="next" value="{{ next }}"><button type="submit">Sign in</button></form>
<p><a href="{% url 'admin:index' %}">Administrator sign in</a></p>
{% endblock %}

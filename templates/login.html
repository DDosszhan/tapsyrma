{% extends "exams/base.html" %}{% block content %}
<h1>Вход в Tapsyrma</h1>
<p class="muted">Введите школьную почту и пароль.</p>
{% if form.errors %}<p class="error" role="alert">Неверная почта или пароль.</p>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}
<input type="hidden" name="next" value="{{ next }}"><button type="submit">Войти</button></form>
<p><a href="{% url 'admin:index' %}">Вход для администратора</a></p>
{% endblock %}

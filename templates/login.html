<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Tapsyrma</title>
<main>
  <h1>Вход в Tapsyrma</h1>
  {% if form.errors %}<p role="alert">Неверный логин или пароль.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Войти</button>
  </form>
</main>

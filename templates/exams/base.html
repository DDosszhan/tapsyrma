<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tapsyrma</title>
<style>
body{font:17px/1.5 system-ui,sans-serif;color:#172033;background:#f4f6fa;margin:0}
main{max-width:800px;margin:40px auto;padding:24px;background:white;border-radius:14px;box-shadow:0 5px 24px #17203312}
h1{line-height:1.2}.muted{color:#566275}.error{color:#9d1d1d}.question{border:1px solid #dce2ea;border-radius:10px;padding:18px;margin:20px 0}
.points{float:right;color:#42577a}.exam-timer{position:sticky;top:0;z-index:1;background:white;border:1px solid #dce2ea;border-radius:8px;padding:8px 12px}label{display:block;margin:12px 0}textarea,input[type=text],input[type=email],input[type=password]{box-sizing:border-box;width:100%;padding:10px;font:inherit}textarea{min-height:130px}
button{font:inherit;background:#124ab3;color:white;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
button:focus,input:focus,textarea:focus{outline:3px solid #86aaff}details{margin:10px 0}.score{font-size:1.4em;font-weight:bold}nav{display:flex;gap:16px;align-items:center;margin-top:28px;border-top:1px solid #dce2ea;padding-top:16px}nav form{margin:0}nav button{background:transparent;color:#124ab3;padding:0;text-decoration:underline}
main.exam-page{max-width:1180px;padding:32px;background:#f9fbfd}
.exam-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px;align-items:start}
.exam-questions{min-width:0}.exam-questions .question{background:white;border-color:#d6dfe9;box-shadow:0 2px 10px #17203308;scroll-margin-top:90px;margin:0 0 16px;padding:24px}
.exam-questions .question:target{border-color:#124ab3;box-shadow:0 0 0 3px #124ab322}
.question-map{position:sticky;top:84px;background:white;border:1px solid #d6dfe9;border-radius:12px;padding:20px;box-shadow:0 2px 10px #17203308}
.question-map h2{font-size:1.1em;margin:0 0 4px}.question-map p{font-size:.88em;margin:0 0 16px;color:#566275}
.question-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.question-grid a{display:grid;place-items:center;min-height:40px;border-radius:8px;background:#e8edf3;color:#344255;text-decoration:none;font-weight:700;border:1px solid #cbd4df}
.question-grid a:hover,.question-grid a:focus-visible{outline:3px solid #86aaff;outline-offset:2px}
.map-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;font-size:.8em;color:#566275}
.map-legend span{display:flex;align-items:center;gap:5px}.map-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:#e8edf3;border:1px solid #cbd4df}
@media(max-width:760px){main.exam-page{margin:0;padding:18px;border-radius:0}.exam-layout{display:flex;flex-direction:column}.question-map{position:static;order:-1;width:100%;box-sizing:border-box}.exam-questions{width:100%}.question-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.exam-questions .question{padding:18px}}
</style>{% block extra_head %}{% endblock %}</head><body><main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}
{% if request.user.is_authenticated %}<nav><a href="{% url 'enter' %}">Все тесты</a>{% if request.user.student_profile %}<a href="{% url 'history' %}">Мои сдачи</a>{% endif %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Выйти</button></form></nav>{% endif %}
</main></body></html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="t d">
<title id="t">Binary place values</title><desc id="d">The bits 00101101 select 32, 8, 4 and 1, which sum to 45.</desc>
<rect width="760" height="250" rx="16" fill="#eef6f3"/>
<text x="28" y="43" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#173b35">Read a binary number from right to left</text>
<text x="30" y="91" font-family="Arial,sans-serif" font-size="16" fill="#4a625c">Place value</text>
<text x="30" y="153" font-family="Arial,sans-serif" font-size="16" fill="#4a625c">Bit</text>
<g font-family="Arial,sans-serif" text-anchor="middle" font-size="25" font-weight="700" fill="#153d36">
<rect x="175" y="64" width="66" height="112" rx="9" fill="#fff" stroke="#ccdcd5"/><text x="208" y="102">128</text><text x="208" y="158">0</text>
<rect x="247" y="64" width="66" height="112" rx="9" fill="#fff" stroke="#ccdcd5"/><text x="280" y="102">64</text><text x="280" y="158">0</text>
<rect x="319" y="64" width="66" height="112" rx="9" fill="#d7f0df" stroke="#81bb98"/><text x="352" y="102">32</text><text x="352" y="158">1</text>
<rect x="391" y="64" width="66" height="112" rx="9" fill="#fff" stroke="#ccdcd5"/><text x="424" y="102">16</text><text x="424" y="158">0</text>
<rect x="463" y="64" width="66" height="112" rx="9" fill="#d7f0df" stroke="#81bb98"/><text x="496" y="102">8</text><text x="496" y="158">1</text>
<rect x="535" y="64" width="66" height="112" rx="9" fill="#d7f0df" stroke="#81bb98"/><text x="568" y="102">4</text><text x="568" y="158">1</text>
<rect x="607" y="64" width="66" height="112" rx="9" fill="#fff" stroke="#ccdcd5"/><text x="640" y="102">2</text><text x="640" y="158">0</text>
<rect x="679" y="64" width="66" height="112" rx="9" fill="#d7f0df" stroke="#81bb98"/><text x="712" y="102">1</text><text x="712" y="158">1</text>
</g>
<text x="28" y="219" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#176b52">00101101₂ = 32 + 8 + 4 + 1 = 45₁₀</text>
</svg>

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tapsyrma</title>
<main>
  <h1>Tapsyrma</h1>
  <p>Hello, {{ request.user.username }}. The platform is ready.</p>
  {% if request.user.is_staff %}<p><a href="{% url 'admin:index' %}">Administration</a></p>{% endif %}
  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Log out</button>
  </form>
</main>
